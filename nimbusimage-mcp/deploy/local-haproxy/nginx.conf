# Same fallback as the production static server (AWSDeploy
# templates/startup_haproxy.tftpl): unknown paths get index.html with a 200.
# (Production also includes mime.types; nothing served here needs it.)
events {}
http {
  sendfile on;
  server {
    listen 80;
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
