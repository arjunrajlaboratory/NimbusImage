# Local rehearsal of the PROPOSED production HAProxy rules for the MCP service
# (codebaseDocumentation/NIMBUSIMAGE_MCP_SERVER.md, Phase 2 and Phase 4).
# Mirrors AWSDeploy templates/startup_haproxy.tftpl (frontend nimbus-backends,
# timeouts, the girder backend's path rewrite) with the MCP additions. Local
# differences, each marked LOCAL below:
#   - plain HTTP on :80; TLS ends at the tunnel, which sets X-Forwarded-Proto
#     (stands in for ssl_fc);
#   - two ports. :80 is the public side: point any tunnel at it, and Girder
#     answers there only for the OAuth discovery documents and sign-in
#     endpoints (authorize, token, revoke), because the local stack keeps
#     the default admin password. :81 (localhost only) stands in for the
#     private network, src ${VPC_CIDR} in production;
#   - each response names its backend (X-Nimbus-Backend) and each deny its
#     rule (X-Nimbus-Deny), for check_routing.sh;
#   - the worker rate limit, the apex-domain redirect and the VPC exemption
#     from the HTTPS redirect are left out;
#   - servers are found through Docker's DNS (resolvers below), so the mcp
#     container can be recreated while HAProxy runs.

global
  log stdout format raw local0

# LOCAL: Docker's embedded DNS; re-resolve when containers are recreated
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

defaults
  mode http
  timeout client 10s
  timeout connect 5s
  timeout server 300s
  timeout http-request 10s
  timeout check 5s
  timeout tunnel 1h
  log global
  option httplog

frontend nimbus-backends
  bind :80
  # LOCAL: the private-network side (see the header). Never copy: port 81
  # is the static server's in production.
  bind :81
  # LOCAL: record who calls, for the connector observations
  http-request capture req.hdr(User-Agent) len 100
  http-request capture req.hdr(Mcp-Protocol-Version) len 20

  # Narrowed from path_beg /.well-known/ so OAuth metadata is never served
  # over plain HTTP; only ACME renewal is exempt from the HTTPS redirect.
  acl acme_challenge path_beg /.well-known/acme-challenge/
  # LOCAL: the tunnel terminates TLS. Never copy this ACL to production,
  # where any client could send the header: production uses ssl_fc.
  acl via_https req.hdr(X-Forwarded-Proto) -i https

  http-request redirect scheme https unless via_https || acme_challenge

  # MCP service (static backend) and its OAuth discovery documents. Exact
  # paths only: no path_beg /.well-known/ rule. The protected-resource
  # metadata for resource <base>/mcp lives at the path-suffixed URL
  # (RFC 9728 section 3.1), which is what the 401 challenge points to.
  acl is_mcp path /mcp
  # A pasted URL with a slash would otherwise get the static server's
  # index.html. 308 keeps the method (a 302 turns a POST into a GET), and a
  # relative location keeps the scheme; the server's own redirect would
  # name http://, since TLS ends here.
  http-request redirect location /mcp code 308 if { path /mcp/ }
  # The real client address, never one it sent: Girder rate-limits OAuth
  # on it (production does the same). LOCAL: the peer is the tunnel, so all
  # tunnel clients share one address here.
  http-request set-header X-Forwarded-For %[src]
  acl is_mcp_resource_metadata path /.well-known/oauth-protected-resource/mcp /.well-known/oauth-protected-resource
  # openid-configuration too: clients probe it after the AS metadata, and the
  # static server would answer it with index.html and a 200
  acl is_oauth_as_metadata path /.well-known/oauth-authorization-server /.well-known/openid-configuration
  use_backend nimbus-mcp if is_mcp || is_mcp_resource_metadata
  use_backend nimbus-girders if is_oauth_as_metadata

  use_backend nimbus-girders if { path /girder } || { path_beg /girder/ } || { path_beg //girder/ }
  default_backend static-server

  # LOCAL: which backend answered, for check_routing.sh
  http-response set-header X-Nimbus-Backend %[be_name]

backend nimbus-mcp
  mode http
  # A request without a key gets 401, so check for that rather than 200
  option httpchk GET /mcp
  http-check expect status 401
  server mcp mcp:8000 check resolvers docker init-addr last,libc,none

backend nimbus-girders
  mode http
  option httpchk GET /api/v1/system/version
  http-check expect status 200
  # LOCAL stand-in for src ${VPC_CIDR}
  acl internal dst_port 81
  http-request set-path "%[path,regsub(^//girder,/)]"
  http-request set-path "%[path,regsub(^/girder,/)]"
  http-request set-path "%[path,regsub('/+','/','g')]"
  # The production rule (Phase 4): introspection only from inside. After
  # the rewrite above, and on the decoded path with slashes collapsed
  # again, so %69ntrospect, //, a trailing slash or a suffix cannot slip
  # past a literal match. In production: !{ src ${VPC_CIDR} }.
  http-request deny status 403 hdr X-Nimbus-Deny introspect if { path,url_dec,regsub('/+','/','g') -m beg -i /api/v1/mcp_oauth/introspect } !internal
  # LOCAL: the shared local Girder is never public, whatever rule routed
  # here, except the OAuth discovery documents and the OAuth endpoints
  # clients call (authorize from browsers; token and revoke from connector
  # backends). Exact paths after the rewrite (which collapses //), so a
  # trailing slash or any other variant is refused.
  http-request deny status 403 hdr X-Nimbus-Deny local-girder if !internal !{ path /.well-known/oauth-authorization-server /.well-known/openid-configuration /api/v1/mcp_oauth/authorize /api/v1/mcp_oauth/token /api/v1/mcp_oauth/revoke }
  server girder girder:8080 check resolvers docker init-addr last,libc,none

backend static-server
  mode http
  server static-server static:80 check resolvers docker init-addr last,libc,none
