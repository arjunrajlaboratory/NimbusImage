services:
  mongodb:
    image: mongo
    volumes:
      - "./db:/data/db"
    ports:
      - 27017:27017
    attach: false

  girder:
    build:
      context: ./devops/girder
    privileged: true
    command: -c "python3 /src/provision.py && girder mount /mnt/fuse && celery -A girder_worker.app worker -Q local -D && uvicorn girder.asgi:app --host 0.0.0.0 --port 8080"
    ports:
      - "${GIRDER_PORT-8080}:8080"
    links:
      - mongodb
      - redis
    volumes:
      # For some versions of Docker on OSX, adding delegated speeds up file
      # access.  It should do no harm on other systems.
      - "./assetstore:/assetstore:delegated"
      - "./logs/girder:/root/.girder/logs:delegated"
      - '/var/run/docker.sock:/var/run/docker.sock'
    env_file:
      - "./girder.env"
      - "./worker.env"
    depends_on:
      - "mongodb"
      - "broker"
    container_name: "girder"

  redis:
    image: redis:latest
    command: ["redis-server", "--maxmemory", "4096MB", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data

  broker:
    image: rabbitmq:3
    attach: false
    env_file:
    - "./worker.env"

  worker:
    image: girder/girder_worker
    # The dispatcher routes jobs to the "cpu"/"gpu" queues; locally one
    # worker consumes all of them, plus the legacy default queue.
    command: -Q celery,cpu,gpu
    links:
      - girder
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    depends_on:
      - broker
    container_name: "worker"
    user: root
    env_file:
    - "./worker.env"

  # The MCP server (nimbusimage-mcp/), off by default: start it with
  #   docker compose --profile mcp up -d mcp
  # Clients send their own API key or OAuth token as a bearer token; the
  # server holds no credential of its own beyond the introspection secret.
  # See nimbusimage-mcp/README.md.
  mcp:
    profiles: ["mcp"]
    build:
      context: ./nimbusimage-mcp
      additional_contexts:
        nimbusimage: ./nimbusimage
    environment:
      NI_API_URL: "http://girder:8080/api/v1"
      # Override both when serving through a public URL (e.g. a tunnel)
      NI_MCP_PUBLIC_URL: "${NI_MCP_PUBLIC_URL:-http://localhost:${MCP_PORT-8001}/mcp}"
      NI_MCP_ISSUER_URL: "${NI_MCP_ISSUER_URL:-http://localhost:${GIRDER_PORT-8080}}"
      # Keep under every proxy timeout in front: a Cloudflare tunnel cuts
      # at 100 s (use 85 there); production uses 120 behind HAProxy's 300 s.
      NI_MCP_MAX_JOB_WAIT: "${NI_MCP_MAX_JOB_WAIT:-240}"
      # Shared with the nimbus_mcp_oauth plugin's
      # mcp_oauth.introspection_secret; unset means API keys only.
      NI_MCP_INTROSPECTION_SECRET: "${NI_MCP_INTROSPECTION_SECRET-}"
    ports:
      - "${MCP_PORT-8001}:8000"
    depends_on:
      - "girder"
    mem_limit: 1g

volumes:
  redis_data:
