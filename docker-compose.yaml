services:
  mongodb:
    image: mongo
    volumes:
      - "./db:/data/db"
    ports:
      - 27017:27017
    attach: false

  girder:
    build:
      context: ./devops/girder
    privileged: true
    command: -c "python3 /src/provision.py && girder mount /mnt/fuse && celery -A girder_worker.app worker -Q local -D && uvicorn girder.asgi:app --host 0.0.0.0 --port 8080"
    ports:
      - "${GIRDER_PORT-8080}:8080"
    links:
      - mongodb
      - redis
    volumes:
      # For some versions of Docker on OSX, adding delegated speeds up file
      # access.  It should do no harm on other systems.
      - "./assetstore:/assetstore:delegated"
      - "./logs/girder:/root/.girder/logs:delegated"
      - '/var/run/docker.sock:/var/run/docker.sock'
    env_file:
      - "./girder.env"
      - "./worker.env"
    depends_on:
      - "mongodb"
      - "broker"
    container_name: "girder"

  redis:
    image: redis:latest
    command: ["redis-server", "--maxmemory", "4096MB", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data

  broker:
    image: rabbitmq:3
    attach: false
    env_file:
    - "./worker.env"

  worker:
    image: girder/girder_worker
    # The dispatcher routes jobs to the "cpu"/"gpu" queues; locally one
    # worker consumes all of them, plus the legacy default queue.
    #
    # This has to override `entrypoint`, not `command`: the girder_worker image's
    # /docker-entrypoint.sh ends in `$BIN -m girder_worker -l info` with no "$@",
    # so anything passed as the command is silently discarded and the worker only
    # ever consumes the default "celery" queue -- leaving every dispatched job
    # parked in "cpu"/"gpu" with no consumer (worker interfaces never load).
    # Bypassing that script is safe because its only other job is defaulting
    # RABBITMQ_USER/PASS/HOST, which worker.env already provides.
    entrypoint: ["python3", "-m", "girder_worker", "-l", "info", "-Q", "celery,cpu,gpu"]
    links:
      - girder
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    depends_on:
      - broker
    container_name: "worker"
    user: root
    env_file:
    - "./worker.env"

volumes:
  redis_data:
