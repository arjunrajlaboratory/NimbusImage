name: Validate agent skills

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".claude/**"
      - ".claude-plugin/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "nimbusimage/README.md"
      - "plugins/nimbusimage/**"
      - ".github/workflows/agent-skills.yaml"
  push:
    branches: [master]
    paths:
      - ".agents/**"
      - ".claude/**"
      - ".claude-plugin/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "nimbusimage/README.md"
      - "plugins/nimbusimage/**"
      - ".github/workflows/agent-skills.yaml"

# A newer push to the same branch supersedes a running check; master keeps
# every run so each merge has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test skill synchronization
        run: python3 -m unittest plugins/nimbusimage/scripts/test_sync_skills.py
      - name: Check Claude and Codex skill parity
        run: python3 plugins/nimbusimage/scripts/sync_skills.py --check
