name: Lint and test nimbusimage-mcp

on:
  push:
    paths:
      - nimbusimage-mcp/**
      # The server is built on the package; a package change can break it.
      - nimbusimage/**
      - .github/workflows/nimbusimage-mcp.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  all:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: flake8 Lint
        uses: py-actions/flake8@v2
        with:
          path: nimbusimage-mcp/
      - name: Install and test nimbusimage-mcp
        run: |
          pip install -e nimbusimage -e "nimbusimage-mcp[dev]"
          cd nimbusimage-mcp
          pytest -m "not integration"
