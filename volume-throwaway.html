<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NimbusImage 3D volume throwaway</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee;
        font-family: system-ui, sans-serif; }
      #app { display: flex; height: 100vh; }
      #vtk { flex: 1; position: relative; }
      #panel { width: 260px; padding: 12px 14px; box-sizing: border-box;
        background: #1b1b1b; overflow-y: auto; font-size: 13px; }
      #panel h1 { font-size: 14px; margin: 0 0 8px; }
      #panel .grp { margin: 14px 0; border-top: 1px solid #333; padding-top: 10px; }
      button { background: #2d2d2d; color: #eee; border: 1px solid #444;
        border-radius: 5px; padding: 6px 10px; cursor: pointer; margin: 2px 0; }
      button.active { background: #2563eb; border-color: #2563eb; }
      label { display: block; margin: 3px 0; cursor: pointer; }
      #status { color: #9ad; white-space: pre-line; line-height: 1.4; }
      .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
        margin-right: 6px; vertical-align: middle; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="vtk"></div>
      <div id="panel">
        <h1>3D volume throwaway</h1>
        <div id="status">starting…</div>

        <div class="grp">
          <div style="margin-bottom:4px;color:#999;">Blend mode</div>
          <button id="mip" class="active">MIP (max intensity)</button>
          <button id="composite">Composite</button>
        </div>

        <div class="grp">
          <div style="margin-bottom:4px;color:#999;">Z spacing</div>
          <button id="aniso" class="active">Correct (5 µm, ~15×)</button>
          <button id="iso">Isotropic (squashed)</button>
        </div>

        <div class="grp" id="channels">
          <div style="margin-bottom:4px;color:#999;">Channels</div>
        </div>

        <div class="grp">
          <div style="margin-bottom:4px;color:#999;">Layers</div>
          <button id="volBtn" class="active">Volume on</button>
          <button id="seg" class="active">Nuclei surfaces on</button>
        </div>

        <div class="grp">
          <button id="reset">Reset camera</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/volumeThrowaway.ts"></script>
  </body>
</html>
