# pnpm 10+ blocks dependency build scripts by default (pnpm 9 ran them).
# Production builds on pnpm 11 with all of these skipped, so none are required;
# set to false to keep them off. Flip one to true to allow its build script.
allowBuilds:
  "@parcel/watcher": false
  canvas: false
  core-js: false
  esbuild: false
  protobufjs: false
  vuex-module-decorators: false
