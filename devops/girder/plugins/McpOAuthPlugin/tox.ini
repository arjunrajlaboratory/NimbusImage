[tox]
envlist =
  py{310, 311}

skip_missing_interpreters = true

[testenv]
passenv = PYTEST_*
deps =
  pytest >= 3.6
  pytest-girder>5
  # Its test helpers (stale model-state cleanup) keep the suite linear.
  -e {toxinidir}/../AnnotationPlugin
  girder-large-image==1.34.2a166

commands =
  pytest {posargs}

[pytest]
testpaths = nimbus_mcp_oauth/test
