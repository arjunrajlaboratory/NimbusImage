[tox]
envlist =
  py{310, 311}

skip_missing_interpreters = true

[testenv]
passenv = PYTEST_*
deps =
  mock
  pytest >= 3.6
  pytest-custom-exit-code
  pytest-girder>5
  # The large-image packages are released in lockstep from the
  # girder/large_image monorepo; the source pins must match the
  # girder-large-image pin or the resolver mixes a stable source
  # with the alpha core.
  girder-large-image==1.34.2a166
  large-image-source-pil==1.34.2a166
  large-image-source-tiff==1.34.2a166


whitelist_externals =
  rm

commands =
  pytest {posargs}

# The default envs test the plugin without the Rust transcoder (the Python
# fallback). This one builds it (needs cargo; maturin comes from pip) and
# runs the tests whose code path it changes. tox doesn't rebuild a path
# dependency on its own: after editing the crate, run `tox -r -e native`.
[testenv:native]
setenv =
  NIMBUS_REQUIRE_NATIVE_JSON = 1
deps =
  {[testenv]deps}
  {toxinidir}/bson-json-native
commands =
  pytest {posargs:upenncontrast_annotation/test/test_native_json.py upenncontrast_annotation/test/test_stubs.py upenncontrast_annotation/test/test_prefetch.py upenncontrast_annotation/test/test_annotations.py}
